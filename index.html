<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAKESHI PIANO</title>
    <style>
        :root {
            --primary: #FF8C00;
            --secondary: #FFD700;
            --bg: #FFF5E1;
            --text: #5C4033;
            --white-key: #FFFFFF;
            --black-key: #333333;
            --key-active: #FFB6C1;
        }
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg);
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
            color: var(--text); overflow: hidden; display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
        }
        /* UI Screens */
        #menu-screen, #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 245, 225, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }
        .hidden { display: none !important; }
        h1 { font-size: 3rem; color: var(--primary); text-shadow: 2px 2px 4px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin: 10px 0; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 80%; max-width: 500px;}
        label { font-size: 1.2rem; font-weight: bold; display: block; margin-bottom: 5px; color: var(--primary); }
        select {
            width: 100%; padding: 10px; font-size: 1.1rem; border: 2px solid var(--secondary);
            border-radius: 8px; background: white; color: var(--text); outline: none;
        }
        .btn {
            background: var(--primary); color: white; border: none; padding: 15px 40px;
            font-size: 1.5rem; border-radius: 30px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 0 #CC7000; margin-top: 20px; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        
        /* Result Screen Specifics */
        #result-box { text-align: center; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #result-title { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }
        .result-stat { font-size: 1.5rem; margin: 10px 0; }
        .btn-group { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .btn-secondary { background: #87CEEB; box-shadow: 0 4px 0 #5F9EA0; }
        
        /* Quit Button */
        #quit-btn {
            position: absolute; top: 10px; right: 20px; z-index: 50;
            background: #FF6347; color: white; border: none; padding: 8px 15px;
            border-radius: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 0 #CD5C5C; font-size: 1rem;
        }
        #quit-btn:active { transform: translateY(3px); box-shadow: none; }

        /* Game Area */
        #game-container { flex: 1; position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        #hud {
            position: absolute; top: 10px; left: 20px; right: 20px; z-index: 10;
            display: flex; justify-content: flex-start; gap: 20px; pointer-events: none;
        }
        .hud-text { font-size: 1.5rem; font-weight: bold; color: var(--text); background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 20px; }
        canvas { width: 100%; flex: 1; display: block; background: linear-gradient(to bottom, #FFF5E1, #FFDAB9); }
        
        /* Piano Keyboard - タブレット向けに高さを45vhに拡大 */
        #keyboard {
            height: 45vh; 
            min-height: 250px;
            width: 100%; position: relative; display: flex;
            background: #222; border-top: 5px solid var(--primary);
        }
        .key {
            position: relative; border: 1px solid #ccc; border-radius: 0 0 8px 8px;
            cursor: pointer; box-sizing: border-box;
        }
        .white-key {
            background: var(--white-key); height: 100%; z-index: 1; flex: 1;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2);
        }
        /* 黒鍵も少し太く（3.8%）して押しやすく */
        .black-key {
            background: var(--black-key); height: 60%; width: 3.8%; position: absolute;
            z-index: 2; transform: translateX(-50%); border-radius: 0 0 6px 6px;
            box-shadow: inset 0 -3px 5px rgba(255,255,255,0.2);
        }
        .white-key.active, .black-key.active { background: var(--key-active); }
        
        /* Floating Text (Perfect, Good, Miss) */
        .feedback {
            position: absolute; font-size: 2.5rem; font-weight: bold; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; z-index: 20; text-shadow: 2px 2px 2px white;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Start Menu -->
    <div id="menu-screen">
        <h1>🎹 TAKESHI PIANO 🎹</h1>
        
        <div class="control-group">
            <label for="song-select">曲をえらぶ</label>
            <select id="song-select"></select>
        </div>

        <div class="control-group">
            <label for="speed-select">スピード</label>
            <select id="speed-select">
                <option value="0.5">0.5x (ゆっくり - 長めのプレイ)</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x (ふつう - 1〜2分)</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x (はやい)</option>
            </select>
        </div>

        <button class="btn" id="start-btn">スタート！</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
        <div id="result-box">
            <div id="result-title">クリア！🎉</div>
            <div class="result-stat">スコア: <span id="final-score">0</span></div>
            <div class="result-stat">最大コンボ: <span id="max-combo">0</span></div>
            <div class="btn-group">
                <button class="btn" id="retry-btn">もう一度</button>
                <button class="btn btn-secondary" id="back-btn">曲をえらぶ</button>
            </div>
        </div>
    </div>

    <!-- Game Area -->
    <div id="game-container" class="hidden">
        <div id="hud">
            <div class="hud-text">Score: <span id="score-display">0</span></div>
            <div class="hud-text">Combo: <span id="combo-display">0</span></div>
        </div>
        <button id="quit-btn">やめる</button>
        <canvas id="game-canvas"></canvas>
        <div id="keyboard"></div>
    </div>

<script>
/**
 * 32 Keys: F3(53) to C6(84)
 */
const START_MIDI = 53; // F3
const END_MIDI = 84;   // C6
const KEYS = [];

for (let i = START_MIDI; i <= END_MIDI; i++) {
    const noteInOctave = i % 12;
    const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave);
    KEYS.push({ midi: i, isBlack: isBlack });
}

/**
 * 楽曲データのパース関数
 */
function parseSong(dataString, loops = 1) {
    const notes = [];
    let currentTime = 0;
    for (let i = 0; i < loops; i++) {
        const parts = dataString.trim().split(/\s+/);
        parts.forEach(p => {
            const [midiStr, durationStr] = p.split(':');
            const m = parseInt(midiStr);
            const d = parseFloat(durationStr);
            if (m > 0) {
                notes.push({ m, t: currentTime, d });
            }
            currentTime += d; 
        });
    }
    return notes;
}

// 15 Songs Library
const SONGS = [
    { title: "きらきら星 ⭐", notes: parseSong("60:1 60:1 67:1 67:1 69:1 69:1 67:2 65:1 65:1 64:1 64:1 62:1 62:1 60:2 67:1 67:1 65:1 65:1 64:1 64:1 62:2 67:1 67:1 65:1 65:1 64:1 64:1 62:2 60:1 60:1 67:1 67:1 69:1 69:1 67:2 65:1 65:1 64:1 64:1 62:1 62:1 60:2", 3) },
    { title: "ちょうちょう ⭐", notes: parseSong("67:1 64:1 64:2 65:1 62:1 62:2 60:1 62:1 64:1 65:1 67:1 67:1 67:2 67:1 64:1 64:2 65:1 62:1 62:2 60:1 64:1 67:1 67:1 64:1 64:1 64:2 62:1 62:1 62:1 62:1 62:1 64:1 65:2 64:1 64:1 64:1 64:1 64:1 65:1 67:2 67:1 64:1 64:2 65:1 62:1 62:2 60:1 64:1 67:1 67:1 64:1 64:1 64:2", 2) },
    { title: "かえるの合唱 ⭐", notes: parseSong("60:1 62:1 64:1 65:1 64:1 62:1 60:2 64:1 65:1 67:1 69:1 67:1 65:1 64:2 60:2 60:2 60:2 60:2 60:0.5 60:0.5 62:0.5 62:0.5 64:0.5 64:0.5 65:0.5 65:0.5 64:1 62:1 60:2", 4) },
    { title: "むすんでひらいて ⭐⭐", notes: parseSong("64:1 64:1 62:1 62:1 60:2 60:2 67:1 67:1 65:1 65:1 64:4 67:1 67:1 69:1 69:1 67:2 67:2 64:1 64:1 65:1 65:1 64:4 64:1 64:1 62:1 62:1 60:2 60:2 67:1 67:1 65:1 65:1 64:4", 3) },
    { title: "チューリップ ⭐⭐", notes: parseSong("60:1 62:1 64:2 60:1 62:1 64:2 67:1 64:1 62:1 60:1 62:4 60:1 62:1 64:2 60:1 62:1 64:2 67:1 64:1 62:1 60:1 62:4 67:1 67:1 64:1 67:1 69:1 69:1 67:2 64:1 64:1 62:1 62:1 60:4", 3) },
    { title: "ぶんぶんぶん ⭐⭐", notes: parseSong("67:1 64:1 64:2 65:1 62:1 62:2 60:1 62:1 64:1 65:1 67:4 62:1 62:1 62:1 64:1 65:4 64:1 64:1 64:1 65:1 67:4 67:1 64:1 64:2 65:1 62:1 62:2 60:1 64:1 60:1 64:1 60:4", 3) },
    { title: "どんぐりころころ ⭐⭐⭐", notes: parseSong("67:1 67:1 64:1 64:1 67:1 69:1 67:2 64:1 64:1 62:1 62:1 60:4 67:1 67:1 64:1 64:1 67:1 69:1 67:2 64:1 64:1 62:1 62:1 60:4 69:1 69:1 69:1 69:1 67:1 67:1 64:2 69:1 69:1 69:1 69:1 67:4 67:1 67:1 64:1 64:1 67:1 69:1 67:2 64:1 64:1 62:1 62:1 60:4", 3) },
    { title: "森のくまさん ⭐⭐⭐", notes: parseSong("60:1 60:1 60:1 62:1 64:2 60:2 67:1 67:1 67:1 69:1 67:4 64:1 64:1 64:1 65:1 67:2 64:2 69:1 69:1 69:1 71:1 69:4 67:1 67:1 67:1 65:1 64:2 62:2 60:1 60:1 62:1 64:1 67:4 67:2 69:2 67:2 64:2 60:2 62:2 60:4", 3) },
    { title: "メリーさんのひつじ ⭐⭐⭐", notes: parseSong("64:1 62:1 60:1 62:1 64:1 64:1 64:2 62:1 62:1 62:2 64:1 67:1 67:2 64:1 62:1 60:1 62:1 64:1 64:1 64:2 62:1 62:1 64:1 62:1 60:4", 4) },
    { title: "歓喜の歌 ⭐⭐⭐⭐", notes: parseSong("64:1 64:1 65:1 67:1 67:1 65:1 64:1 62:1 60:1 60:1 62:1 64:1 64:1.5 62:0.5 62:2 64:1 64:1 65:1 67:1 67:1 65:1 64:1 62:1 60:1 60:1 62:1 64:1 62:1.5 60:0.5 60:2 62:1 62:1 64:1 60:1 62:1 64:0.5 65:0.5 64:1 60:1 62:1 64:0.5 65:0.5 64:1 62:1 60:1 62:1 55:2 64:1 64:1 65:1 67:1 67:1 65:1 64:1 62:1 60:1 60:1 62:1 64:1 62:1.5 60:0.5 60:2", 3) },
    { title: "アメイジング・グレイス ⭐⭐⭐⭐", notes: parseSong("60:1 65:2 69:0.5 65:0.5 69:2 67:1 65:2 60:1 60:1 65:2 69:0.5 65:0.5 69:2 72:1 72:3 69:1 72:2 69:0.5 72:0.5 69:2 65:1 60:2 60:1 65:2 69:0.5 65:0.5 69:2 67:1 65:3 0:1", 4) },
    { title: "聖者の行進 ⭐⭐⭐⭐", notes: parseSong("60:1 64:1 65:1 67:3 0:1 60:1 64:1 65:1 67:3 0:1 60:1 64:1 65:1 67:1 64:1 60:1 64:1 62:3 0:1 64:1 64:1 62:1 60:3 60:1 64:1 67:2 67:1 65:3 0:1 64:1 65:1 67:1 64:1 60:1 62:1 60:4", 3) },
    { title: "エリーゼのために ⭐⭐⭐⭐⭐", notes: parseSong("76:0.5 75:0.5 76:0.5 75:0.5 76:0.5 71:0.5 74:0.5 72:0.5 69:2 0:0.5 60:0.5 64:0.5 69:0.5 71:2 0:0.5 64:0.5 68:0.5 71:0.5 72:2 0:0.5 64:0.5 76:0.5 75:0.5 76:0.5 75:0.5 76:0.5 71:0.5 74:0.5 72:0.5 69:2 0:0.5 60:0.5 64:0.5 69:0.5 71:2 0:0.5 64:0.5 72:0.5 71:0.5 69:4", 5) },
    { title: "トルコ行進曲 ⭐⭐⭐⭐⭐", notes: parseSong("71:0.5 72:0.5 74:1 71:0.5 72:0.5 74:1 71:0.5 72:0.5 74:0.5 72:0.5 71:0.5 69:0.5 67:2 67:0.5 69:0.5 71:1 67:0.5 69:0.5 71:1 67:0.5 69:0.5 71:0.5 69:0.5 67:0.5 66:0.5 64:2 71:0.5 72:0.5 74:1 71:0.5 72:0.5 74:1 71:0.5 72:0.5 74:0.5 72:0.5 71:0.5 69:0.5 67:2 74:1 71:1 72:1 69:1 67:4", 4) },
    { title: "ねこふんじゃった ⭐⭐⭐⭐⭐", notes: parseSong("66:0.5 68:0.5 61:1 66:1 61:1 66:1 66:0.5 68:0.5 61:1 66:1 61:1 66:1 66:0.5 68:0.5 63:1 68:1 63:1 68:1 68:0.5 70:0.5 63:1 68:1 63:1 68:1 68:0.5 70:0.5 63:1 68:1 63:1 68:1 68:0.5 70:0.5 63:1 68:1 63:1 68:1 68:0.5 70:0.5 61:1 66:1 61:1 66:1 66:0.5 68:0.5 61:1 66:1 61:1 66:4", 3) }
];

// Audio Context setup
let audioCtx;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playTone(midi) {
    if(!audioCtx) return;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 1.5);
}

// Build UI Elements
const selectSong = document.getElementById('song-select');
SONGS.forEach((song, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.innerText = song.title;
    selectSong.appendChild(opt);
});

// Build Keyboard
const keyboardDiv = document.getElementById('keyboard');
const keyElements = {}; 
const whiteKeys = KEYS.filter(k => !k.isBlack);
const numWhiteKeys = whiteKeys.length;

KEYS.forEach((key) => {
    const el = document.createElement('div');
    el.classList.add('key');
    el.dataset.midi = key.midi;
    
    if (key.isBlack) {
        el.classList.add('black-key');
        const prevWhiteIndex = whiteKeys.findIndex(wk => wk.midi === key.midi - 1);
        const leftPercent = ((prevWhiteIndex + 1) / numWhiteKeys) * 100;
        el.style.left = `${leftPercent}%`;
        keyboardDiv.appendChild(el);
    } else {
        el.classList.add('white-key');
        keyboardDiv.appendChild(el);
    }
    
    keyElements[key.midi] = el;
});

// Game State
let isPlaying = false;
let activeNotes = [];
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let speedMult = 1.0;
let animationId;
let gameFinished = false;
let finishTimer = null;

const BEAT_DURATION = 600; 
const FALL_TIME = 2000;    

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight - keyboardDiv.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

// Controls
function handlePress(midi) {
    if (!isPlaying || gameFinished) return;
    const el = keyElements[midi];
    if (el) el.classList.add('active');
    playTone(midi);
    
    const hitTime = performance.now();
    let hitFound = false;
    
    for (let i = 0; i < activeNotes.length; i++) {
        const note = activeNotes[i];
        if (note.midi === parseInt(midi) && !note.hit && !note.missed) {
            const timeDiff = Math.abs(hitTime - note.targetTime);
            if (timeDiff < 200) { 
                note.hit = true;
                hitFound = true;
                if (timeDiff < 60) {
                    showFeedback("Perfect!", el);
                    score += 100;
                } else {
                    showFeedback("Good!", el);
                    score += 50;
                }
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                updateHUD();
                break;
            }
        }
    }
}

function handleRelease(midi) {
    const el = keyElements[midi];
    if (el) el.classList.remove('active');
}

// Touch & Mouse events
const activeTouches = new Map();

keyboardDiv.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('key')) {
            const midi = target.dataset.midi;
            activeTouches.set(touch.identifier, midi);
            handlePress(midi);
        }
    }
}, {passive: false});

keyboardDiv.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const oldMidi = activeTouches.get(touch.identifier);
        
        if (target && target.classList.contains('key')) {
            const newMidi = target.dataset.midi;
            if (oldMidi !== newMidi) {
                if (oldMidi) handleRelease(oldMidi);
                activeTouches.set(touch.identifier, newMidi);
                handlePress(newMidi);
            }
        } else if (oldMidi) {
            handleRelease(oldMidi);
            activeTouches.delete(touch.identifier);
        }
    }
}, {passive: false});

keyboardDiv.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const midi = activeTouches.get(touch.identifier);
        if (midi) {
            handleRelease(midi);
            activeTouches.delete(touch.identifier);
        }
    }
});

keyboardDiv.addEventListener('mousedown', (e) => {
    initAudio();
    if (e.target.classList.contains('key')) {
        handlePress(e.target.dataset.midi);
    }
});
keyboardDiv.addEventListener('mouseup', (e) => {
    if (e.target.classList.contains('key')) {
        handleRelease(e.target.dataset.midi);
    }
});
keyboardDiv.addEventListener('mouseleave', (e) => {
    if (e.target.classList.contains('key')) {
        handleRelease(e.target.dataset.midi);
    }
});

function showFeedback(text, keyEl) {
    const fb = document.createElement('div');
    fb.classList.add('feedback');
    fb.innerText = text;
    fb.style.color = text === 'Perfect!' ? '#FFD700' : (text === 'Good!' ? '#32CD32' : '#FF0000');
    
    const rect = keyEl.getBoundingClientRect();
    fb.style.left = `${rect.left + rect.width/2 - 40}px`;
    fb.style.bottom = `${window.innerHeight - rect.top + 10}px`;
    
    document.body.appendChild(fb);
    setTimeout(() => fb.remove(), 800);
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('combo-display').innerText = combo;
}

// Game Loop
function startGame() {
    initAudio();
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('game-container').classList.remove('hidden');
    
    resizeCanvas();
    
    const songIdx = selectSong.value;
    speedMult = parseFloat(document.getElementById('speed-select').value);
    const beatTime = BEAT_DURATION / speedMult;
    
    score = 0;
    combo = 0;
    maxCombo = 0;
    updateHUD();
    
    startTime = performance.now() + 1500; 
    activeNotes = SONGS[songIdx].notes.map(n => ({
        midi: n.m,
        targetTime: startTime + (n.t * beatTime),
        duration: n.d,
        hit: false,
        missed: false
    }));
    
    isPlaying = true;
    gameFinished = false;
    if(finishTimer) clearTimeout(finishTimer);
    
    requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
    if (!isPlaying) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw lane separators
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    const whiteKeyWidth = canvas.width / numWhiteKeys;
    for(let i=1; i<numWhiteKeys; i++) {
        ctx.beginPath();
        ctx.moveTo(i * whiteKeyWidth, 0);
        ctx.lineTo(i * whiteKeyWidth, canvas.height);
        ctx.stroke();
    }
    
    let allNotesDone = true;
    
    // Draw notes
    activeNotes.forEach(note => {
        if (note.hit || note.missed) return;
        allNotesDone = false;
        
        const timeDiff = note.targetTime - now;
        
        if (timeDiff > FALL_TIME) return; 
        
        if (timeDiff < -200) { 
            note.missed = true;
            combo = 0;
            updateHUD();
            const el = keyElements[note.midi];
            if(el) showFeedback("Miss", el);
            return;
        }
        
        const y = canvas.height - (timeDiff / FALL_TIME) * canvas.height;
        const keyInfo = KEYS.find(k => k.midi === note.midi);
        let x, w;
        
        if (!keyInfo.isBlack) {
            const idx = whiteKeys.findIndex(wk => wk.midi === note.midi);
            w = canvas.width / numWhiteKeys;
            x = idx * w;
            ctx.fillStyle = 'rgba(135, 206, 235, 0.8)';
        } else {
            const prevWhiteIndex = whiteKeys.findIndex(wk => wk.midi === note.midi - 1);
            // 黒鍵のノーツ幅も画面に合わせて調整
            w = (canvas.width / numWhiteKeys) * 0.7;
            x = (prevWhiteIndex + 1) * (canvas.width / numWhiteKeys) - (w / 2);
            ctx.fillStyle = 'rgba(255, 140, 0, 0.9)';
        }
        
        ctx.fillRect(x + 2, y - 20, w - 4, 20);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y - 20, w - 4, 20);
    });
    
    if (allNotesDone && !gameFinished) {
        gameFinished = true;
        finishTimer = setTimeout(showResult, 2000);
    }
    
    if (isPlaying) {
        animationId = requestAnimationFrame(gameLoop);
    }
}

function showResult() {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    
    document.getElementById('final-score').innerText = score;
    document.getElementById('max-combo').innerText = maxCombo;
    
    document.getElementById('result-screen').classList.remove('hidden');
}

function quitGame() {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    if(finishTimer) clearTimeout(finishTimer);
    
    document.getElementById('game-container').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

// Event Listeners
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('quit-btn').addEventListener('click', quitGame);

document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('game-container').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
});

// Initial Setup
resizeCanvas();
</script>
